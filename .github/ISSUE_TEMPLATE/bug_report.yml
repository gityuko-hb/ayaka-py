name: '🐛 Bug Report'
description: 'Report a bug in ayaka-py'
labels: ['bug', 'unconfirmed']
type: Bug
body:
  - type: dropdown
    attributes:
      label: '💻 Operating System'
      multiple: true
      options:
        - 'Linux (x86_64)'
        - 'Linux (aarch64)'
        - 'macOS (Apple Silicon)'
        - 'macOS (Intel)'
        - 'Windows'
        - 'Other'
    validations:
      required: true

  - type: input
    attributes:
      label: '🐍 Python Version'
      description: 'Output of `python --version`'
      placeholder: 'e.g. Python 3.13.2'
    validations:
      required: true

  - type: input
    attributes:
      label: '📦 ayaka-py Version'
      description: 'Version or commit hash'
      placeholder: 'e.g. v0.1.0 or ee14d93'
    validations:
      required: true

  - type: dropdown
    attributes:
      label: '📥 Installation Method'
      options:
        - 'pip install ayaka-py'
        - 'uv add ayaka-py'
        - 'pip install git+https://...'
        - 'uv sync (local clone)'
        - 'Other'
    validations:
      required: true

  - type: dropdown
    attributes:
      label: '🖥️ GPU / Backend'
      multiple: true
      options:
        - 'CUDA (NVIDIA)'
        - 'ROCm (AMD)'
        - 'Apple Metal / MPS'
        - 'CPU (no GPU)'
        - 'Other'
      default: 3
    validations:
      required: false

  - type: textarea
    attributes:
      label: '🐛 What happened?'
      description: 'A clear and concise description of the bug.'
    validations:
      required: true

  - type: textarea
    attributes:
      label: '📷 How to reproduce it?'
      description: 'Minimal reproducible example — prefer a Python snippet or CLI command.'
      render: python

  - type: textarea
    attributes:
      label: '🚦 What did you expect?'
      description: 'What should have happened instead?'

  - type: textarea
    attributes:
      label: '📋 Logs / Traceback'
      description: 'Paste any error traceback or log output here.'
      render: text

  - type: textarea
    attributes:
      label: '📝 Additional Information'
      description: 'Anything else that might help — model name, input size, config, etc.'

  - type: dropdown
    attributes:
      label: '🛠️ Willing to Submit a PR?'
      options:
        - 'Yes, I am willing to submit a PR'
        - 'No, but I am happy to help test the fix'
        - 'No'
    validations:
      required: false

  - type: checkboxes
    attributes:
      label: '✅ Checklist'
      description: 'Please confirm before submitting.'
      options:
        - label: 'I have searched existing issues and this bug has not been reported yet.'
          required: true
        - label: 'I have included the Python version and OS.'
          required: true
        - label: 'I have provided a minimal reproducible example or clear steps to reproduce.'
          required: false
